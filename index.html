<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>우현이와 연우의 당근 점프 (토끼야 따라와!)</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #bfe6f7; overflow: hidden; }
  body { font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #222;
         display: flex; align-items: center; justify-content: center; touch-action: manipulation;
         -webkit-user-select: none; user-select: none; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: center; text-align: center; background: rgba(255,255,255,.72); gap: 1.6vmin; padding: 3vmin; }
  .overlay[hidden] { display: none; }
  .overlay h1 { margin: 0; font-weight: 400; font-size: clamp(26px, 6.5vmin, 60px); }
  .overlay p { margin: 0; font-size: clamp(14px, 3vmin, 24px); line-height: 1.5; }
  .overlay .big { font-size: clamp(20px, 4.6vmin, 40px); }
  .cast { display: flex; align-items: stretch; gap: 3vmin; }
  .pick { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .6vmin; padding: 1.2vmin 2.4vmin;
          background: #fff; border: 5px solid #bbb; border-radius: 3vmin; color: #222; font-size: clamp(15px, 3.2vmin, 26px); }
  .pick img { height: clamp(56px, 17vmin, 150px); }
  .pick { position: relative; opacity: .65; transition: transform .12s; }
  .pick[aria-pressed="true"] { border-color: #000; background: #ffe27a; opacity: 1; transform: scale(1.1); }
  .pick[aria-pressed="true"]::after { content: "선택!"; position: absolute; top: -1.1em; right: -1.2em; background: #ff4d6d; color: #fff;
          border: 4px solid #000; border-radius: 999px; padding: .1em .6em; font-size: .75em; transform: rotate(10deg); }
  .overlay h1 small { display: block; font-size: .5em; margin-top: .3em; }
  button { font: inherit; cursor: pointer; }
  .go { font-size: clamp(18px, 4vmin, 32px); padding: .5em 1.5em; background: #ffadc9; color: #222;
        border: 5px solid #000; border-radius: 999px; }
  .go:active { transform: translateY(3px); }
  .row { display: flex; gap: 1.2vmin; align-items: center; justify-content: center; flex-wrap: wrap; }
  .row[hidden] { display: none; }
  input#name { font: inherit; font-size: clamp(16px, 3.4vmin, 28px); width: 9em; padding: .35em .7em; text-align: center;
               border: 5px solid #000; border-radius: 999px; background: #fff; color: #222; outline: none; }
  input#name:focus { background: #fff7c2; }
  .go.small { font-size: clamp(15px, 3.2vmin, 26px); padding: .4em 1.1em; }
  .go.plain { background: #fff; }
  .go:disabled { opacity: .5; cursor: default; }
  .board { list-style: none; margin: 0; padding: 0; font-size: clamp(13px, 2.9vmin, 23px); line-height: 1.45;
           display: grid; grid-template-rows: repeat(5, auto); grid-auto-flow: column; column-gap: 5vmin; text-align: left; }
  .board li { display: flex; gap: .6em; white-space: nowrap; }
  .board li b { font-weight: 400; min-width: 1.6em; text-align: right; }
  .board li span { flex: 1; overflow: hidden; text-overflow: ellipsis; max-width: 9em; }
  .board li.me { background: #ffe27a; border-radius: .4em; padding: 0 .4em; }
  .overlay h2 { margin: 0; font-weight: 400; font-size: clamp(18px, 4vmin, 34px); }
  .note { font-size: clamp(12px, 2.4vmin, 19px) !important; min-height: 1.4em; }
  #boardScreen { background: rgba(255,255,255,.97); }
  #mute { position: absolute; top: 2.5%; right: 2%; width: clamp(34px, 6vmin, 52px); height: clamp(34px, 6vmin, 52px);
          border: 4px solid #000; border-radius: 50%; background: #fff; font-size: clamp(14px, 2.6vmin, 22px); padding: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <button id="mute" aria-label="소리 켜기/끄기">♪</button>

  <div class="overlay" id="startScreen">

  function spawn() {
    const L = LEVELS[S.stage - 1];
    const x = W + 80, o = Object.assign({ x }, KINDS[pick(L.kinds)]);
    S.obs.push(o);
    if (o.k === 'bird') {
      // birds fly toward the player; from stage 3 most of them also swoop up and down
      o.vx = rnd(90, 150) + S.stage * 12;
      if (S.stage >= 3 && Math.random() < .7) { o.y0 = 150; o.amp = rnd(34, 46); o.ph = rnd(0, 6.28); o.w0 = rnd(3.2, 4.4); }
      else { o.y0 = o.y; o.amp = 0; o.ph = 0; o.w0 = 0; }
      for (let i = 0; i < 4; i++) S.carrots.push({ x: x - 60 + i * 62, y: 50, ph: rnd(0, 6) });
      S.nextSpawn = S.dist + o.w + S.speed * rnd(L.gap[0], L.gap[1]) + 160;
      return;
    }
    // carrots: an arc over the obstacle, or a row on the ground after it
    const mode = Math.random();
    if (mode < .55) {
      const n = 3, cx = x + o.w / 2, top = o.h + 110;
      for (let i = 0; i < n; i++) {
        const u = (i - (n - 1) / 2);
        S.carrots.push({ x: cx + u * 70, y: top - Math.abs(u) * 45, ph: rnd(0, 6) });
      }
    } else if (mode < .85) {
      const n = 2 + Math.floor(rnd(0, 3)), sx = x + o.w + 200;
      for (let i = 0; i < n; i++) S.carrots.push({ x: sx + i * 62, y: 50, ph: rnd(0, 6) });
    } else {
      S.carrots.push({ x: x + o.w / 2, y: o.h + 210, ph: rnd(0, 6) }); // high one: needs 2단 점프
    }
    const gap = S.speed * rnd(L.gap[0], L.gap[1]) + 160;
    S.nextSpawn = S.dist + o.w + gap;
  }

  // ---------- input ----------
  function jump() {
    if (state !== 'play') return;
    const p = S.p;
    if (p.jumps === 0) { p.vy = JUMP; p.jumps = 1; sJump(); }
    else if (p.jumps === 1) { p.vy = JUMP2; p.jumps = 2; sJump(); S.pops.push({ x: PX + PW / 2, y: GROUND - p.y, t: 0, kind: 'puff' }); }
  }
  function start(stage) {
    reset(typeof stage === 'number' ? stage : 1); state = 'play'; last = performance.now();
    S.banner = { s: S.stage + '단계 시작!', t: 0 };
    $('startScreen').hidden = true; $('clearScreen').hidden = true;
    $('overScreen').hidden = true; $('boardScreen').hidden = true;
    startMusic(S.stage);
  }
  let clearShownAt = 0;
  function goHome() {
    stopMusic(); reset(1); state = 'start';
    $('overScreen').hidden = true; $('clearScreen').hidden = true; $('startScreen').hidden = false;
  }
  function stageClear() {
    stopMusic(); sFanfare();
    if (S.stage >= STAGES) { S.won = true; gameOver(); return; }
    state = 'clear';
    $('clearTitle').textContent = S.stage + '단계 통과!';
    $('clearText').textContent = '토끼에게 당근 ' + GOAL + '개를 줬어요! (모두 ' + total() + '개)';
    $('nextBtn').textContent = (S.stage + 1) + '단계 시작';
    setTimeout(() => { if (state === 'clear') { $('clearScreen').hidden = false; clearShownAt = performance.now(); } }, 700);
  }
  function gameOver() {
    state = 'over'; stopMusic();
    $('againBtn').textContent = S.won ? '처음부터 다시 하기' : S.stage + '단계 다시 하기';
    $('overTitle').textContent = S.won ? '모든 단계 통과!' : '게임 끝!';
    $('result').textContent = S.won ? '토끼에게 당근 ' + total() + '개를 다 줬어요! 최고예요!'
      : S.stage + '단계에서 당근 ' + S.fed + '개! (모두 ' + total() + '개)';
    $('saveRow').hidden = total() <= 0; $('saveBtn').disabled = false; $('saveNote').textContent = '';
    $('name').value = CHARS[charKey].name;
    showBoard($('overBoard'), null);
    setTimeout(() => { $('overScreen').hidden = false;  }, 500);
  }
  async function doSave() {
    const name = $('name').value.trim();
    if (!name) { $('saveNote').textContent = '이름을 먼저 써 주세요!'; $('name').focus(); return; }
    if ($('saveBtn').disabled) return;
    $('saveBtn').disabled = true; $('saveNote').textContent = '저장하는 중…';
    const shared = await saveScore(name, total());
    $('saveRow').hidden = true;
    $('saveNote').textContent = shared ? name + '의 기록을 저장했어요!' : name + '의 기록을 이 기기에 저장했어요!';
    showBoard($('overBoard'), null);
  }
  document.querySelectorAll('.pick').forEach(b => { b.onclick = () => { chooseChar(b.dataset.ch); b.blur(); beep(660, 990, .12, 'sine', .1); }; });
  try { chooseChar(localStorage.getItem('carrotJumpChar') || 'woohyun'); } catch (e) {}
  $('saveBtn').onclick = doSave;
  $('name').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); doSave(); } });
  $('boardBtn').onclick = () => { $('boardScreen').hidden = false; showBoard($('mainBoard'), $('boardNote')); };
  $('closeBoard').onclick = () => { $('boardScreen').hidden = true; };
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!$('boardScreen').hidden) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'play') jump();
      else if (state === 'start') start(1);
      else if (state === 'clear' && !$('clearScreen').hidden && performance.now() - clearShownAt > 1200) start(S.stage + 1);
      // game-over screen: buttons only, so jump-mashing can't skip saving a record
    }
  });
  cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
  $('startBtn').onclick = () => start(1);
  $('againBtn').onclick = () => start(S.won ? 1 : S.stage);
  $('nextBtn').onclick = () => start(S.stage + 1);
  $('homeBtn').onclick = goHome;
  document.getElementById('mute').onclick = e => {
    muted = !muted; e.currentTarget.textContent = muted ? '×' : '♪'; e.currentTarget.blur();
    if (muted) stopMusic(); else if (state === 'play') startMusic(S.stage);
  };

  // ---------- update ----------
  function update(dt) {
    S.t += dt; S.stageT += dt;
    const target = LEVELS[S.stage - 1].speed + Math.min(40, S.stageT * 1.2);
    S.speed += Math.max(-200 * dt, Math.min(200 * dt, target - S.speed)); // ease into each stage's speed
    if (S.banner) { S.banner.t += dt; if (S.banner.t > 1.6) S.banner = null; }
    const dx = S.speed * dt; S.dist += dx;
    const p = S.p, r = S.r;

    // person
    p.vy -= GRAV * dt; p.y += p.vy * dt;
    if (p.y <= 0) { p.y = 0; p.vy = 0; p.jumps = 0; }
    if (p.inv > 0) p.inv -= dt;

    // rabbit follows, hopping over things by itself
    r.vy -= GRAV * dt; r.y += r.vy * dt;
    if (r.y <= 0) {
      r.y = 0; r.vy = 0;
      const lead = S.speed * .3;
      const near = S.obs.some(o => o.k !== 'bird' && o.x - (RX + RW) < lead && o.x + o.w > RX + 20);
      r.vy = near ? 900 : 330; // big jump over obstacles, little hops otherwise
    }
    if (r.happy > 0) r.happy -= dt;

    if (S.dist >= S.nextSpawn) spawn();
    S.obs.forEach(o => {
      o.x -= dx;
      if (o.k === 'bird') { o.x -= o.vx * dt; o.y = o.y0 + Math.sin(S.t * o.w0 + o.ph) * o.amp; }
    });
    S.carrots.forEach(c => c.x -= dx);
    S.obs = S.obs.filter(o => o.x + o.w > -50);
    S.carrots = S.carrots.filter(c => c.x > -50 && !c.got);
    S.clouds.forEach(c => { c.x -= dx * .12; if (c.x < -160) { c.x = W + rnd(40, 200); c.y = rnd(40, 150); } });

    // collisions
    const bx1 = PX + 30, bx2 = PX + PW - 30, by1 = p.y + 6, by2 = p.y + PH - 24; // heights above ground
    for (const c of S.carrots) {
      if (c.x + 20 > bx1 - 8 && c.x - 20 < bx2 + 8 && c.y + 26 > by1 - 6 && c.y - 26 < by2 + 6) {
        c.got = true; sCarrot();
        S.fly.push({ x0: c.x, y0: GROUND - c.y, t: 0 });
      }
    }
    if (p.inv <= 0) for (const o of S.obs) {
      const m = o.k === 'puddle' ? 14 : 10;
      const oy = o.y || 0;
      if (o.x + m < bx2 && o.x + o.w - m > bx1 && by1 < oy + o.h - 6 && by2 > oy + 8) {
        S.hearts--; p.inv = 1.4; S.shake = .3; sHit();
        S.pops.push({ x: PX + PW / 2, y: GROUND - p.y - PH, t: 0, kind: 'text', s: '아야!' });
        if (S.hearts <= 0) { gameOver(); return; }
        break;
      }
    }

    // carrots flying to the rabbit
    for (const f of S.fly) {
      f.t += dt / .45;
      if (f.t >= 1 && !f.done) {
        f.done = true; S.fed++; r.happy = .5; sYum();
        S.pops.push({ x: RX + RW / 2, y: GROUND - r.y - RH - 6, t: 0, kind: 'text', s: '냠냠!' });
        if (S.fed >= GOAL) { stageClear(); return; }
        else if (S.fed % 25 === 0 && S.hearts < 3) {
          S.hearts++; sHeart();
          S.pops.push({ x: RX + RW / 2 + 50, y: GROUND - r.y - RH - 30, t: 0, kind: 'heart' });
        }
      }
    }
    S.fly = S.fly.filter(f => !f.done);
    S.pops.forEach(q => q.t += dt); S.pops = S.pops.filter(q => q.t < .8);
    if (S.shake > 0) S.shake -= dt;
  }

  // ---------- drawing (thick black outlines, like the drawings) ----------
  function ink(fill, lw) { g.fillStyle = fill; g.fill(); g.lineWidth = lw || 5; g.strokeStyle = '#000'; g.lineJoin = g.lineCap = 'round'; g.stroke(); }

  function drawCarrot(x, y, s, rot) {
    g.save(); g.translate(x, y); g.rotate(rot || 0); g.scale(s, s);
    g.beginPath(); g.moveTo(-5, -18); g.quadraticCurveTo(-16, -34, -10, -38); g.quadraticCurveTo(-3, -34, 0, -22);
    g.quadraticCurveTo(2, -38, 8, -40); g.quadraticCurveTo(14, -32, 5, -18); g.closePath(); ink('#4cb944', 4);
    g.beginPath(); g.moveTo(-14, -16); g.quadraticCurveTo(0, -24, 14, -16); g.quadraticCurveTo(10, 10, 0, 30);
    g.quadraticCurveTo(-10, 10, -14, -16); g.closePath(); ink('#ff8a1f', 4);
    g.beginPath(); g.moveTo(-6, -4); g.lineTo(2, -3); g.moveTo(-2, 8); g.lineTo(5, 9); g.lineWidth = 3; g.stroke();
    g.restore();
  }
  function drawHeart(x, y, s, fill) {
    g.save(); g.translate(x, y); g.scale(s, s);
    g.beginPath(); g.moveTo(0, 12); g.bezierCurveTo(-22, -4, -12, -22, 0, -8); g.bezierCurveTo(12, -22, 22, -4, 0, 12); g.closePath();
    ink(fill, 4); g.restore();
  }
  function drawObstacle(o) {
    const x = o.x, y = GROUND;
    if (o.k === 'bird') {
      const cy = GROUND - o.y - o.h / 2, cx = x + o.w / 2, flap = Math.sin(S.t * 16) * 16;
      g.beginPath(); g.moveTo(x + 4, cy + 2); g.lineTo(x - 14, cy + 8); g.lineTo(x + 6, cy + 12); g.closePath(); ink('#ffb02e', 4);
      g.beginPath(); g.ellipse(cx, cy, o.w / 2 - 4, o.h / 2 - 2, 0, 0, 7); ink('#6aa8ff');
      g.beginPath(); g.moveTo(cx - 6, cy - 4); g.quadraticCurveTo(cx + 12, cy - 30 - flap, cx + 30, cy - 8 - flap * .4); g.quadraticCurveTo(cx + 14, cy - 2, cx - 6, cy - 4); g.closePath(); ink('#3f7fe0', 4);
      g.beginPath(); g.arc(x + 20, cy - 5, 3.5, 0, 7); g.fillStyle = '#000'; g.fill();
    } else if (o.k === 'rock') {
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 4, y - o.h * .8, x + o.w * .3, y - o.h);
      g.quadraticCurveTo(x + o.w * .7, y - o.h * 1.05, x + o.w * .9, y - o.h * .55); g.quadraticCurveTo(x + o.w + 4, y - 10, x + o.w, y);
      g.closePath(); ink('#a9adb5');
      g.beginPath(); g.moveTo(x + o.w * .3, y - o.h * .55); g.lineTo(x + o.w * .45, y - o.h * .35); g.lineWidth = 4; g.stroke();
    } else if (o.k === 'log') {
      g.beginPath(); g.roundRect(x, y - o.h, o.w, o.h, 22); ink('#b9773f');
      g.beginPath(); g.ellipse(x + o.w - 20, y - o.h / 2, 14, o.h / 2 - 6, 0, 0, 7); ink('#f0c890', 4);
      g.beginPath(); g.ellipse(x + o.w - 20, y - o.h / 2, 5, o.h / 5, 0, 0, 7); g.lineWidth = 3; g.stroke();
      g.beginPath(); g.moveTo(x + 22, y - o.h * .65); g.lineTo(x + 58, y - o.h * .65); g.moveTo(x + 34, y - o.h * .32); g.lineTo(x + 72, y - o.h * .32); g.lineWidth = 4; g.stroke();
    } else if (o.k === 'cactus') {
      g.beginPath(); g.roundRect(x - 12, y - o.h * .62, 18, 30, 9); ink('#3fae5a');
      g.beginPath(); g.roundRect(x + o.w - 6, y - o.h * .8, 18, 34, 9); ink('#3fae5a');
      g.beginPath(); g.roundRect(x + 6, y - o.h, o.w - 12, o.h + 4, 18); ink('#3fae5a');
      g.beginPath(); for (let i = 0; i < 3; i++) { g.moveTo(x + 18, y - o.h + 22 + i * 22); g.lineTo(x + 26, y - o.h + 22 + i * 22); g.moveTo(x + o.w - 22, y - o.h + 32 + i * 22); g.lineTo(x + o.w - 14, y - o.h + 32 + i * 22); }
      g.lineWidth = 3; g.stroke();
    } else {
      g.beginPath(); g.ellipse(x + o.w / 2, y + 8, o.w / 2, 14, 0, 0, 7); ink('#5bb8f0');
      g.beginPath(); g.ellipse(x + o.w * .38, y + 5, 16, 3, 0, 0, 7); g.fillStyle = '#fff'; g.fill();
    }
  }
  function drawCloud(c) {
    g.save(); g.translate(c.x, c.y); g.scale(c.s, c.s);
    g.beginPath(); g.arc(0, 0, 26, Math.PI * .5, Math.PI * 1.5); g.arc(30, -18, 30, Math.PI, Math.PI * 1.9);
    g.arc(70, -4, 24, Math.PI * 1.4, Math.PI * .5); g.closePath(); ink('#fff', 4); g.restore();
  }
  function hills(par, base, amp, col) {
    const off = (S.dist * par) % 480;
    g.beginPath(); g.moveTo(0, GROUND);
    for (let x = -off - 480; x < W + 480; x += 480) { g.quadraticCurveTo(x + 120, base - amp, x + 240, base); g.quadraticCurveTo(x + 360, base - amp * .55, x + 480, base); }
    g.lineTo(W, GROUND); g.closePath(); g.fillStyle = col; g.fill();
  }

  function draw() {
    g.save();
    if (state === 'play' && S.shake > 0) g.translate(rnd(-6, 6), rnd(-6, 6));
    const sc = LEVELS[S.stage - 1].sky, night = S.stage === 5;
    const sky = g.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, sc[0]); sky.addColorStop(1, sc[1]);
    g.fillStyle = sky; g.fillRect(-10, -10, W + 20, H + 20);
    if (night) { g.fillStyle = '#fff'; for (const s of STARS) { g.globalAlpha = .5 + .5 * Math.sin(S.t * 2 + s[0]); g.fillRect(s[0], s[1], s[2], s[2]); } g.globalAlpha = 1; }
    g.beginPath(); g.arc(820, 90, 44, 0, 7); ink(night ? '#fff6c9' : S.stage >= 3 ? '#ff9a3d' : '#ffd94a');
    S.clouds.forEach(drawCloud);
    hills(.15, 380, 150, '#a8dba0'); hills(.3, 410, 90, '#86c97c');

    // ground
    g.fillStyle = '#7ccf5f'; g.fillRect(-10, GROUND, W + 20, 30);
    g.fillStyle = '#c98f55'; g.fillRect(-10, GROUND + 30, W + 20, H);
    g.beginPath(); g.moveTo(-10, GROUND); g.lineTo(W + 10, GROUND); g.lineWidth = 5; g.strokeStyle = '#000'; g.stroke();
    const off = S.dist % 120; g.lineWidth = 4; g.beginPath();
    for (let x = -off; x < W + 120; x += 120) { g.moveTo(x + 20, GROUND + 14); g.lineTo(x + 26, GROUND + 4); g.lineTo(x + 32, GROUND + 14); g.moveTo(x + 80, GROUND + 60); g.lineTo(x + 96, GROUND + 60); }
    g.stroke();

    S.obs.forEach(drawObstacle);
    S.carrots.forEach(c => drawCarrot(c.x, GROUND - c.y + Math.sin(S.t * 5 + c.ph) * 5, 1, .25));

    // rabbit
    const r = S.r, sq = r.happy > 0 ? 1 + Math.sin(r.happy * 25) * .08 : 1;
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(RX + RW / 2, GROUND + 6, 34 - Math.min(r.y, 120) * .12, 7, 0, 0, 7); g.fill();
    g.save(); g.translate(RX + RW / 2, GROUND - r.y); g.rotate(Math.max(-.2, Math.min(.2, -r.vy / 4000))); g.scale(sq, 2 - sq);
    g.drawImage(rabbitImg, -RW / 2, -RH + 2, RW, RH); g.restore();

    // person
    const p = S.p, blink = state === 'play' && p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0;
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(PX + PW / 2, GROUND + 6, 44 - Math.min(p.y, 200) * .1, 8, 0, 0, 7); g.fill();
    if (!blink) {
      const onGround = p.y === 0 && state === 'play';
      const bob = onGround ? Math.abs(Math.sin(S.t * 14)) * 9 : 0;
      const rock = onGround ? Math.sin(S.t * 14) * .07 : Math.max(-.25, Math.min(.25, -p.vy / 3600));
      g.save(); g.translate(PX + PW / 2, GROUND - p.y - bob); g.rotate(rock);
      g.drawImage(personImg, -PW / 2, -PH + 4, PW, PH); g.restore();
    }

    // flying carrots → rabbit
    for (const f of S.fly) {
      const t = Math.min(1, f.t), tx = RX + RW * .7, ty = GROUND - r.y - RH * .55;
      const x = f.x0 + (tx - f.x0) * t, y = f.y0 + (ty - f.y0) * t - Math.sin(t * Math.PI) * 90;
      drawCarrot(x, y, 1 - t * .35, t * -6);
    }
    // pops
    for (const q of S.pops) {
      const a = 1 - q.t / .8; g.globalAlpha = Math.max(0, a);
      if (q.kind === 'text') {
        g.font = "30px 'Jua', sans-serif"; g.textAlign = 'center'; g.lineWidth = 6; g.strokeStyle = '#fff'; g.lineJoin = 'round';
        g.strokeText(q.s, q.x, q.y - q.t * 50); g.fillStyle = '#000'; g.fillText(q.s, q.x, q.y - q.t * 50);
      } else if (q.kind === 'heart') drawHeart(q.x, q.y - q.t * 60, 1.3, '#ff4d6d');
      else { g.beginPath(); g.arc(q.x - 20, q.y + 6, 10 + q.t * 20, 0, 7); g.arc(q.x + 20, q.y + 6, 8 + q.t * 16, 0, 7); g.fillStyle = '#fff'; g.fill(); }
      g.globalAlpha = 1;
    }
    g.restore();

    // HUD
    if (state !== 'start') {
      for (let i = 0; i < 3; i++) drawHeart(42 + i * 46, 44, 1.25, i < S.hearts ? '#ff4d6d' : '#fff');
      drawCarrot(W / 2 - 46, 46, .85, .25);
      g.font = "40px 'Jua', sans-serif"; g.textAlign = 'left'; g.lineWidth = 7; g.strokeStyle = '#fff'; g.lineJoin = 'round';
      const txt = '× ' + S.fed + ' / ' + GOAL;
      g.strokeText(txt, W / 2 - 18, 58); g.fillStyle = '#000'; g.fillText(txt, W / 2 - 18, 58);
      g.font = "34px 'Jua', sans-serif"; g.textAlign = 'right';
      g.strokeText(S.stage + '단계', W - 84, 56); g.fillText(S.stage + '단계', W - 84, 56);
      if (S.banner && state === 'play') {
        const b = S.banner, first = false, s = b.s, tt = b.t;
        const sc2 = 1 + Math.max(0, .25 - tt) * 2;
        g.save(); g.translate(W / 2, 210); g.scale(sc2, sc2); g.textAlign = 'center'; g.font = "84px 'Jua', sans-serif";
        g.lineWidth = 14; g.strokeStyle = '#000'; g.strokeText(s, 0, 0); g.fillStyle = first ? '#ffe04a' : '#fff'; g.fillText(s, 0, 0); g.restore();
      }
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = Math.min(.033, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'start') { S.t += dt; S.dist += 120 * dt; S.clouds.forEach(c => { c.x -= 15 * dt; if (c.x < -160) c.x = W + 80; }); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
